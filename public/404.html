<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link not found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0e0e22, #131234); color: #fff; text-align: center; padding: 20px;
    }
    .box { max-width: 380px; }
    .ico { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 26px; letter-spacing: -0.02em; margin-bottom: 8px; }
    p { color: #9c9cb4; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">🔗</div>
    <h1>This link doesn't exist</h1>
    <p>It may have been removed, paused, or expired. Please check the link and try again.</p>
  </div>
</body>
</html>
