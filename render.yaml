services:
  - type: web
    name: linkpulse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VISITOR_SALT
        generateValue: true
      # Optional — enables free automatic backups to a private GitHub repo:
      # - key: GITHUB_TOKEN
      #   sync: false
      # - key: BACKUP_REPO
      #   sync: false
